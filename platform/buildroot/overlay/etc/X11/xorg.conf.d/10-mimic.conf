Section "Module"
    # Resolve framebuffer helper symbols before loading fbdev on musl.
    Load "fbdevhw"
    Load "shadow"
EndSection
Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
Section "Device"
    Identifier "MimicFramebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection
Section "Screen"
    Identifier "MimicScreen"
    Device "MimicFramebuffer"
    DefaultDepth 24
EndSection
Section "InputClass"
    Identifier "MimicTouchscreen"
    MatchProduct "Goodix Capacitive TouchScreen"
    MatchIsTouchscreen "on"
    MatchDevicePath "/dev/input/event*"
    Driver "evdev"
EndSection
Section "InputClass"
    Identifier "MimicKeyboard"
    MatchIsKeyboard "on"
    MatchDevicePath "/dev/input/event*"
    Driver "evdev"
EndSection
